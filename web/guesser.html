<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tilted — BalanceGuessr</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar">
    <div class="brand">Tilted<small>BALANCEGUESSR</small></div>
    <div><span class="label">round</span><span class="value" id="round">round 1 of 5</span></div>
    <div><span class="label">stage</span><span class="value" id="game-mode">STUDY</span></div>
    <div><span class="label">phase</span><span class="value" id="phase">—</span></div>
    <div><span class="label">score</span><span class="value" id="score">0 pts</span></div>
    <div><span class="label">best</span><span class="value" id="best">0 pts</span></div>
    <div><a href="/index.html" class="topbar-link">← back to atlas</a></div>
    <button type="button" id="conn" class="conn-button" title="click to change how this page connects">○ connecting</button>
  </div>

  <div id="picker-root"></div>

  <div class="guessr-stage">
    <div class="panel active" id="study-panel">
      <div class="panel-label">study · satellite imagery</div>
      <div id="study"></div>
    </div>
    <div class="panel" id="guess-panel">
      <div class="panel-label">guess · place a pin</div>
      <div id="guess"></div>
      <div class="crosshair"></div>
    </div>
  </div>

  <div id="reveal" class="hidden">
    <div>
      <div id="reveal-name">—</div>
      <span id="reveal-hint"></span>
    </div>
    <div class="reveal-stat">
      <span class="k">distance</span>
      <span class="v dist" id="reveal-dist">—</span>
    </div>
    <div class="reveal-stat">
      <span class="k">score</span>
      <span class="v" id="reveal-score">—</span>
    </div>
    <div class="reveal-cta">
      step back on board or <kbd>G</kbd> · next round
    </div>
  </div>

  <div id="summary" class="hidden">
    <div class="summary-header">
      <div>
        <div class="summary-title">Game complete</div>
        <span class="summary-sub">5 rounds · across Ontario</span>
      </div>
      <div class="summary-totals">
        <div class="summary-totals-cell">
          <span class="k">total</span>
          <span class="v" id="summary-total">—</span>
        </div>
        <div class="summary-totals-cell">
          <span class="k">best</span>
          <span class="v" id="summary-best">—</span>
        </div>
        <div class="summary-newbest hidden" id="summary-new-best">★ new best</div>
      </div>
    </div>
    <div class="summary-rounds" id="summary-rounds"></div>
    <div class="summary-cta">
      step back on board or <kbd>G</kbd> · new game
    </div>
  </div>

  <script type="module" src="/src/guesser.ts"></script>
</body>
</html>
