<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>balance-board-leaflet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar">
    <div class="brand">balance<small>BOARD ATLAS</small></div>
    <div><span class="label">mode</span><span class="value" id="mode">ABSENT</span></div>
    <div><span class="label">phase</span><span class="value" id="phase">—</span></div>
    <div><span class="label">load</span><span class="value" id="weight">—</span></div>
    <div><a href="/guesser.html" style="color:var(--text-dim);text-decoration:none;letter-spacing:0.2em;">→ BALANCEGUESSR</a></div>
    <div id="conn">○ connecting</div>
  </div>

  <div id="map"></div>

  <div id="status" class="cop-pad" data-mode="ABSENT" data-status="DISCONNECTED">
    <span class="label-tag top">center of pressure</span>
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    <div id="cop-dot"></div>
    <span class="label-tag bottom">live</span>
  </div>

  <div class="help">
    <strong>Quick gestures</strong>
    <dl>
      <dt>Pan</dt>     <dd>Tilt — body weight steers the map.</dd>
      <dt>Zoom in</dt> <dd>Lift left leg.</dd>
      <dt>Zoom out</dt><dd>Lift right leg.</dd>
      <dt>Speed</dt>   <dd>Bob up/down while leg raised.</dd>
      <dt>Pause</dt>   <dd>Step off.</dd>
      <dt>Re-zero</dt> <dd>Press <kbd>R</kbd> to re-calibrate body lean.</dd>
    </dl>
  </div>

  <script type="module" src="/src/map.ts"></script>
</body>
</html>
